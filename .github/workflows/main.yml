name: Oscar Job Scanner

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      backfill_mode:
        description: "Renvoyer les offres des 14 derniers jours"
        required: false
        default: false
        type: boolean

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests python-dotenv beautifulsoup4

      - name: Restaurer seen_posts.json (cache)
        uses: actions/cache@v4
        with:
          path: seen_posts.json
          key: seen-posts-${{ github.ref_name }}
          restore-keys: seen-posts-

      - name: Lancer le scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKFILL_MODE: ${{ inputs.backfill_mode || 'false' }}
        run: python scanner.py
